name: Preview cleanup

# Removes a pull request's preview folder from gh-pages once the pull request is closed or merged.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  remove:
    name: Remove preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Remove pr-${{ github.event.pull_request.number }} from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/publish-pages.sh remove "pr-$PR_NUMBER"
