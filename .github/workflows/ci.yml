name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request supersedes the old run; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    # TEMPORARY (F0-4d): room for the A/B step below.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # The benchmark prints a Markdown table of events per second; it also goes to
      # the job summary. With `shell: bash` the step runs with pipefail, so a run
      # below the threshold fails the step despite the pipe into tee.
      - run: pnpm --silent bench | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      # TEMPORARY (F0-4d): main and this branch in turn on the same runner, 5 rounds,
      # both with this branch's benchmark scripts; then CPU profiles of the crowded Delay.
      - name: A/B with main on this runner (temporary)
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git worktree add ../main-ab FETCH_HEAD
          cp packages/kernel/bench/*.ts ../main-ab/packages/kernel/bench/
          cp packages/blocks/bench/*.ts ../main-ab/packages/blocks/bench/
          (cd ../main-ab && pnpm install --frozen-lockfile > /dev/null && pnpm --filter @mozaika/kernel --filter @mozaika/blocks build > /dev/null)
          measure() {
            local side=$1 round=$2 dir=$3
            (cd "$dir/packages/kernel" && node bench/events.ts) | grep -E '^\| (Очередь|Большая|Процессы)' | sed "s/^/$side $round K /"
            (cd "$dir/packages/kernel" && node --expose-gc bench/agents.ts) | grep -E '^\| (Единиц|Память на)' | sed "s/^/$side $round A /"
            (cd "$dir/packages/kernel" && node --expose-gc bench/moving-agents.ts) | grep -E '^\| (Единиц|Память на)' | sed "s/^/$side $round M /"
            (cd "$dir/packages/blocks" && node bench/mm1.ts && node --expose-gc bench/crowded-delay.ts) | grep -E '^\| (M/M/1|Единиц|Память на)' | sed "s/^/$side $round B /"
          }
          # Variants of the branch: the same code with other constants of the ladder queue.
          for variant in t200:200:4 e1:50:1; do
            IFS=: read -r name threshold perBucket <<< "$variant"
            git worktree add "../$name" HEAD
            cp packages/kernel/bench/*.ts "../$name/packages/kernel/bench/"
            (cd "../$name" && pnpm install --frozen-lockfile > /dev/null && pnpm --filter @mozaika/kernel --filter @mozaika/blocks build > /dev/null)
            sed -i "s/^const SPLIT_THRESHOLD = 50;/const SPLIT_THRESHOLD = $threshold;/; s/^const EVENTS_PER_BUCKET = 4;/const EVENTS_PER_BUCKET = $perBucket;/" "../$name/packages/kernel/dist/ladder-queue.js"
            grep -E '^const (SPLIT_THRESHOLD|EVENTS_PER_BUCKET)' "../$name/packages/kernel/dist/ladder-queue.js"
          done
          for round in 1 2 3 4; do
            # The order of the sides turns each round, so that none always runs on a warmer machine.
            sides="main:../main-ab branch:. t200:../t200 e1:../e1"
            for shift in $(seq 1 $(( (round - 1) % 4 ))); do sides="$(echo $sides | cut -d' ' -f2-) $(echo $sides | cut -d' ' -f1)"; done
            for side in $sides; do measure "${side%%:*}" $round "${side#*:}"; done
          done
      - name: CPU profiles of the crowded Delay and M/M/1 (temporary)
        shell: bash
        run: |
          for bench in crowded-delay mm1; do
          for side in main branch; do
            if [ "$side" = main ]; then dir=../main-ab; else dir=.; fi
            for flags in "" "--no-turbo-inlining"; do
              rm -rf "/tmp/prof-$side"
              (cd "$dir/packages/blocks" && node --expose-gc $flags --cpu-prof --cpu-prof-dir="/tmp/prof-$side" bench/$bench.ts > /dev/null)
              echo "PROFILE $bench $side $flags"
              python3 - "/tmp/prof-$side" <<'PY'
          import collections, glob, json, sys
          profile = json.load(open(glob.glob(sys.argv[1] + '/*.cpuprofile')[0]))
          nodes = {node['id']: node for node in profile['nodes']}
          times = collections.Counter()
          for sample, delta in zip(profile['samples'], profile['timeDeltas']):
              frame = nodes[sample]['callFrame']
              times[f"{frame['functionName'] or '(anon)'} {frame['url'].split('/')[-1]}:{frame['lineNumber']}"] += delta
          total = sum(times.values())
          for name, time in times.most_common(25):
              print(f'PROF {100 * time / total:5.1f}% {name}')
          PY
            done
          done
          done

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          # Shown on the preview page, so it is clear which commit is being viewed.
          VITE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: viewer
          path: packages/viewer/dist
          if-no-files-found: error
          retention-days: 14

  # Publishes the viewer to GitHub Pages (gh-pages branch) once every check is green:
  # main goes to the site root, each pull request to its own folder pr-<number>/.
  preview:
    name: Preview
    needs: [types, lint, test, bench, build]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
      pull-requests: write
    concurrency:
      group: pages-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: viewer
          path: viewer-dist

      - name: Publish to gh-pages
        id: publish
        run: |
          target=root
          if [ -n "$PR_NUMBER" ]; then target="pr-$PR_NUMBER"; fi
          .github/scripts/publish-pages.sh deploy viewer-dist "$target"

          # Pages answers 404 here until it is enabled for the repository.
          if site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            site="https://$owner.github.io/${GITHUB_REPOSITORY#*/}/"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          url="${site%/}/"
          if [ "$target" != root ]; then url="$url$target/"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link on the pull request
        if: github.event_name == 'pull_request'
        env:
          URL: ${{ steps.publish.outputs.url }}
          PAGES_ENABLED: ${{ steps.publish.outputs.enabled }}
        run: |
          marker='<!-- mozaika-preview -->'
          body="$marker
          **Превью:** $URL
          Сборка из коммита ${COMMIT_SHA:0:7}; страница обновляется примерно через минуту после публикации."
          if [ "$PAGES_ENABLED" != true ]; then
            body="$body

          ⚠️ GitHub Pages для репозитория ещё не включён, поэтому ссылка пока не открывается. Включить: Settings → Pages → Build and deployment → Source: «Deploy from a branch», ветка \`gh-pages\`, папка \`/ (root)\`. Для приватного репозитория Pages доступен только на платном тарифе (GitHub Pro и выше)."
          fi

          comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          existing=$(gh api "$comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api --method POST "$comments" -f body="$body" > /dev/null
          fi
